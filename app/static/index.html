<!DOCTYPE html>
<!--
  MesaTCG · Interfaz del Sprint 1
  ================================
  Pantallas (ver matriz en docs/TRAZABILIDAD.md):
    1. Configuración  → HU-02 CA1 (nombres + meta)
    2. Partida        → HU-02 CA2/CA3 (marcador) + HU-01 CA1/CA2 (panel de dado)

  GUÍA
  - Esta página NO contiene reglas del juego: todo cálculo (rango del dado,
    mínimo 0, ganador) lo hace la API en Python. Aquí solo se pinta lo que
    responde el servidor. Si una regla cambia, NO se toca este archivo.
  - Sin dependencias externas ni build (RNF-03: solo un navegador).
    Las fuentes están autoalojadas en /static/fonts/ (licencia OFL).
  - Sin localStorage a propósito: la persistencia es HU-03 (Sprint 2).
    Si recargas la página, la partida se pierde. Eso es esperado en este sprint.

  DIRECCIÓN VISUAL: campo de batalla medieval, brutalista.
  - Hierro y hollín de base, un solo acento: brasa (fuego de antorcha).
  - Grenze Gotisch (gótica) solo para el título y el anuncio del ganador.
  - Big Shoulders Stencil (estarcido militar) para números, nombres y botones.
  - Esquinas biseladas como placas de armadura; nada redondeado.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- RNF-03 · se adapta al ancho del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121110">
  <title>MesaTCG</title>
  <!-- Precarga: evita que los números cambien de fuente al aparecer -->
  <link rel="preload" href="/static/fonts/big-shoulders-stencil.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ------------------------------------------------------------------
       Fuentes autoalojadas (variables: un archivo cubre todos los pesos)
       ------------------------------------------------------------------ */
    @font-face {
      font-family: "Grenze Gotisch";
      src: url("/static/fonts/grenze-gotisch.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: "Big Shoulders Stencil";
      src: url("/static/fonts/big-shoulders-stencil.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    /* ------------------------------------------------------------------
       Tokens. Tema oscuro único: se juega en mesas con luz baja y
       el fondo oscuro no encandila al rival.
       ------------------------------------------------------------------ */
    :root {
      --hollin: #121110;   /* fondo */
      --hierro: #1c1a18;   /* paneles */
      --forja:  #3a3631;   /* bordes y botones secundarios */
      --ceniza: #e9e4da;   /* texto principal */
      --humo:   #a39b8e;   /* texto secundario */
      --brasa:  #e0602a;   /* ÚNICO acento: acción principal, dado, ganador */
      --tinta-sobre-brasa: #121110;

      --gotica: "Grenze Gotisch", "Times New Roman", serif;
      --estarcido: "Big Shoulders Stencil", "Arial Narrow", sans-serif;

      /* RNF-01 · altura mínima de botón: 64px (guías móviles piden 44-48px) */
      --toque: 64px;
      /* Bisel de placa de armadura: el mismo en todo botón y panel */
      --bisel: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        /* resplandor de brasas desde abajo, muy tenue */
        radial-gradient(120% 60% at 50% 110%, rgb(224 96 42 / .14), transparent 70%),
        var(--hollin);
      background-attachment: fixed;
      color: var(--ceniza);
      font-family: var(--estarcido);
      font-weight: 700;
      letter-spacing: .02em;
      /* evita el zoom por doble toque al marcar puntos rápido */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      max-width: 480px;           /* mobile-first: en desktop se ve como celular */
      margin: 0 auto;
      min-height: 100dvh;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #pantalla-partida { display: flex; flex-direction: column; gap: 14px; }
    .oculto { display: none !important; }

    /* Placa biselada: forma compartida por paneles y botones */
    .placa {
      clip-path: polygon(
        var(--bisel) 0, calc(100% - var(--bisel)) 0, 100% var(--bisel),
        100% calc(100% - var(--bisel)), calc(100% - var(--bisel)) 100%,
        var(--bisel) 100%, 0 calc(100% - var(--bisel)), 0 var(--bisel)
      );
    }

    h1 {
      font-family: var(--gotica);
      font-weight: 900;
      font-size: 3rem;
      line-height: 1;
      margin: 8px 0 0;
      letter-spacing: 0;
    }

    .panel {
      background: var(--hierro);
      /* borde interior simulado (clip-path recorta los bordes reales) */
      box-shadow: inset 0 0 0 2px var(--forja);
      padding: 18px 16px;
    }

    /* ------------------------------------------------------------------
       Formulario de configuración
       ------------------------------------------------------------------ */
    label {
      display: block;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--humo);
      margin: 14px 0 6px;
    }
    label:first-child { margin-top: 0; }
    input {
      width: 100%;
      min-height: var(--toque);
      font: inherit;
      font-size: 1.6rem;
      padding: 0 14px;
      border: 2px solid var(--forja);
      border-radius: 0;
      background: var(--hollin);
      color: var(--ceniza);
    }
    input:focus-visible { outline: 3px solid var(--brasa); outline-offset: 2px; border-color: var(--brasa); }

    /* ------------------------------------------------------------------
       Botones
       ------------------------------------------------------------------ */
    button {
      min-height: var(--toque);
      font: inherit;
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      border: 0;
      color: var(--ceniza);
      background: var(--forja);
      cursor: pointer;
      transition: transform .08s ease-out, filter .15s;
    }
    /* sensación de golpe físico al pulsar */
    button:active { transform: translateY(2px) scale(.98); filter: brightness(.9); }
    button:focus-visible { outline: 3px solid var(--brasa); outline-offset: 3px; }
    button:disabled { opacity: .3; cursor: not-allowed; }
    .principal {
      width: 100%;
      margin-top: 18px;
      background: var(--brasa);
      color: var(--tinta-sobre-brasa);
      font-size: 1.7rem;
    }
    .error {
      color: var(--brasa);
      min-height: 1.2em;
      margin: 10px 0 0;
      font-size: 1.05rem;
    }

    /* ------------------------------------------------------------------
       Marcador (HU-02)
       ------------------------------------------------------------------ */
    .marcador { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .jugador { text-align: center; }
    .jugador .nombre {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--humo);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* RNF-01 · puntaje de 96px: se lee desde el otro lado de la mesa */
    .jugador .puntos {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      margin: 4px 0 12px;
      font-variant-numeric: tabular-nums;
    }
    .jugador.lider .puntos { color: var(--brasa); }
    .jugador .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    /* −1 y +1 se distinguen por forma y peso, no solo por color */
    .btn-restar { background: transparent; box-shadow: inset 0 0 0 2px var(--forja); }
    .btn-sumar  { background: var(--ceniza); color: var(--hollin); }
    .meta {
      text-align: center;
      color: var(--humo);
      margin: 0;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    /* HU-02 CA3 · anuncio del ganador, en gótica: el único momento épico */
    .ganador {
      text-align: center;
      background: var(--brasa);
      color: var(--tinta-sobre-brasa);
      padding: 14px 16px 18px;
      font-family: var(--gotica);
      font-weight: 900;
      font-size: 2.4rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    /* ------------------------------------------------------------------
       Panel de dado (HU-01)
       ------------------------------------------------------------------ */
    .tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tipos button { background: transparent; box-shadow: inset 0 0 0 2px var(--forja); }
    .tipos button[aria-pressed="true"] { background: var(--ceniza); color: var(--hollin); box-shadow: none; }
    /* CA2 + RNF-01 · resultado "en grande": 160px de cifra, legible a 1 m */
    .resultado {
      font-size: 10rem;
      font-weight: 900;
      line-height: 1;
      color: var(--brasa);
      margin: 16px 0 0;
      height: 1em;               /* alto fijo: la pantalla no salta al lanzar */
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }
    /* Estado vacío: antes de la primera tirada se explica qué hacer */
    .resultado:empty::before {
      content: "Elige un dado y lanza";
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--humo);
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .resultado-tipo {
      text-align: center;
      color: var(--humo);
      margin: 4px 0 0;
      min-height: 1.2em;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: .2em;
    }
    /* golpe corto al aparecer: comunica que la tirada cambió (CA2: reemplaza) */
    @media (prefers-reduced-motion: no-preference) {
      .resultado.nuevo { animation: golpe .22s cubic-bezier(.16, 1, .3, 1); }
    }
    @keyframes golpe { from { transform: scale(1.35); opacity: .3; } to { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
<main>
  <h1>MesaTCG</h1>

  <!-- ==============================================================
       Pantalla 1 · Configuración   → HU-02 CA1 / RF-03
       ============================================================== -->
  <section id="pantalla-config" class="panel placa">
    <form id="form-config" novalidate>
      <label for="jugador1">Jugador 1</label>
      <input id="jugador1" maxlength="30" autocomplete="off" required>
      <label for="jugador2">Jugador 2</label>
      <input id="jugador2" maxlength="30" autocomplete="off" required>
      <label for="meta">Meta de puntos</label>
      <input id="meta" type="number" inputmode="numeric" min="1" max="999" value="8" required>
      <button class="principal placa" type="submit">Empezar partida</button>
      <p id="error-config" class="error" role="alert"></p>
    </form>
  </section>

  <!-- ==============================================================
       Pantalla 2 · Partida
       ============================================================== -->
  <section id="pantalla-partida" class="oculto">
    <!-- HU-02 CA3 · aparece solo cuando alguien alcanza la meta -->
    <div id="ganador" class="ganador placa oculto" role="status" aria-live="polite"></div>

    <!-- HU-02 CA2 · marcador de dos jugadores -->
    <div class="marcador">
      <div class="panel placa jugador" data-jugador="0">
        <div class="nombre"></div>
        <div class="puntos" aria-live="polite">0</div>
        <div class="botones">
          <button class="btn-restar placa" data-accion="restar" aria-label="Restar 1">−1</button>
          <button class="btn-sumar placa" data-accion="sumar" aria-label="Sumar 1">+1</button>
        </div>
      </div>
      <div class="panel placa jugador" data-jugador="1">
        <div class="nombre"></div>
        <div class="puntos" aria-live="polite">0</div>
        <div class="botones">
          <button class="btn-restar placa" data-accion="restar" aria-label="Restar 1">−1</button>
          <button class="btn-sumar placa" data-accion="sumar" aria-label="Sumar 1">+1</button>
        </div>
      </div>
    </div>
    <p id="texto-meta" class="meta"></p>

    <!-- HU-01 · panel de dado -->
    <div class="panel placa" id="panel-dado">
      <div id="tipos" class="tipos" role="group" aria-label="Tipo de dado"></div>
      <div id="resultado" class="resultado" aria-live="polite"></div>
      <p id="resultado-tipo" class="resultado-tipo"></p>
      <button id="btn-lanzar" class="principal placa">Lanzar</button>
    </div>

    <!-- Solo visible al terminar: empezar otra partida.
         (La confirmación antes de borrar es HU-03 CA3, Sprint 2.) -->
    <button id="btn-nueva" class="principal placa oculto">Nueva partida</button>
    <p id="error-partida" class="error" role="alert"></p>
  </section>
</main>

<script>
  // =================================================================
  // Estado de la interfaz (solo en memoria, sin persistencia: HU-03)
  // =================================================================
  let partidaId = null;     // id que entrega la API al crear la partida
  let tipoDado = "d6";      // tipo seleccionado en el panel de dado

  const $ = (sel) => document.querySelector(sel);

  // Llamada genérica a la API. Devuelve el JSON o lanza un Error con el
  // mensaje del servidor, para mostrarlo al jugador en vez de fallar en silencio.
  async function api(metodo, ruta, cuerpo) {
    const resp = await fetch(ruta, {
      method: metodo,
      headers: cuerpo ? { "Content-Type": "application/json" } : {},
      body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    });
    const datos = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      const detalle = Array.isArray(datos.detail) ? "Revisa los datos ingresados" : datos.detail;
      throw new Error(detalle || "Error de conexión");
    }
    return datos;
  }

  function mostrar(pantalla) {
    $("#pantalla-config").classList.toggle("oculto", pantalla !== "config");
    $("#pantalla-partida").classList.toggle("oculto", pantalla !== "partida");
  }

  // =================================================================
  // HU-02 CA1 · Configurar partida → ambos marcadores parten en 0
  // =================================================================
  $("#form-config").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    $("#error-config").textContent = "";
    try {
      const partida = await api("POST", "/api/partidas", {
        jugador1: $("#jugador1").value,
        jugador2: $("#jugador2").value,
        meta: Number($("#meta").value),
      });
      partidaId = partida.id;
      pintarMarcador(partida);
      $("#resultado").textContent = "";      // vacío → muestra "Elige un dado y lanza"
      $("#resultado-tipo").textContent = "";
      mostrar("partida");
    } catch (error) {
      $("#error-config").textContent = error.message;
    }
  });

  // =================================================================
  // HU-02 CA2 · +1 / −1   (el mínimo 0 lo aplica el servidor)
  // =================================================================
  document.querySelectorAll(".jugador").forEach((tarjeta) => {
    tarjeta.addEventListener("click", async (evento) => {
      const boton = evento.target.closest("button[data-accion]");
      if (!boton) return;
      $("#error-partida").textContent = "";
      try {
        const partida = await api(
          "POST",
          `/api/partidas/${partidaId}/jugadores/${tarjeta.dataset.jugador}/${boton.dataset.accion}`
        );
        pintarMarcador(partida);
      } catch (error) {
        $("#error-partida").textContent = error.message;
      }
    });
  });

  // Dibuja el marcador con lo que respondió la API (única fuente de verdad).
  function pintarMarcador(partida) {
    document.querySelectorAll(".jugador").forEach((tarjeta, i) => {
      tarjeta.querySelector(".nombre").textContent = partida.nombres[i];
      tarjeta.querySelector(".puntos").textContent = partida.puntajes[i];
      const otro = partida.puntajes[1 - i];
      tarjeta.classList.toggle("lider", partida.puntajes[i] > otro);
    });
    $("#texto-meta").textContent = `Meta: ${partida.meta} puntos`;

    // HU-02 CA3 · anunciar ganador y congelar el marcador
    const hayGanador = partida.ganador !== null;
    $("#ganador").textContent = hayGanador ? `¡Ganó ${partida.ganador}!` : "";
    $("#ganador").classList.toggle("oculto", !hayGanador);
    $("#btn-nueva").classList.toggle("oculto", !hayGanador);
    document.querySelectorAll(".jugador button").forEach((b) => (b.disabled = hayGanador));
  }

  $("#btn-nueva").addEventListener("click", () => {
    partidaId = null;
    mostrar("config");
  });

  // =================================================================
  // HU-01 · Panel de dado
  // =================================================================
  // Los botones de tipo se generan desde la API (/api/dado/tipos), así la
  // lista de dados vive en un solo lugar: app/dominio/dado.py
  async function cargarTipos() {
    const tipos = await api("GET", "/api/dado/tipos");
    $("#tipos").innerHTML = "";
    tipos.forEach((tipo) => {
      const b = document.createElement("button");
      b.className = "placa";
      b.textContent = tipo;
      b.setAttribute("aria-pressed", String(tipo === tipoDado));
      b.addEventListener("click", () => {
        tipoDado = tipo;
        document.querySelectorAll("#tipos button")
          .forEach((x) => x.setAttribute("aria-pressed", String(x.textContent === tipo)));
      });
      $("#tipos").appendChild(b);
    });
  }

  // CA1 · elegir tipo + "Lanzar" → valor en rango (lo calcula Python)
  // CA2 · el resultado se muestra en grande y REEMPLAZA al anterior
  $("#btn-lanzar").addEventListener("click", async () => {
    $("#error-partida").textContent = "";
    try {
      const tirada = await api("POST", "/api/dado", { tipo: tipoDado });
      const caja = $("#resultado");
      caja.textContent = tirada.valor;            // reemplaza, no acumula
      caja.classList.remove("nuevo");
      void caja.offsetWidth;                       // reinicia la animación
      caja.classList.add("nuevo");
      $("#resultado-tipo").textContent = tirada.tipo;
    } catch (error) {
      $("#error-partida").textContent = error.message;
    }
  });

  cargarTipos().catch(() => {
    $("#error-config").textContent = "No se pudo conectar con el servidor";
  });
</script>
</body>
</html>
